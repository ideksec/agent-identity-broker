[project]
name = "broker"
version = "0.1.0"
description = "Agent Identity Broker"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.0",
    "pydantic==2.9.2",
    "pydantic-settings==2.6.0",
    "sqlalchemy==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.13.3",
    "httpx==0.27.2",
    "PyJWT[crypto]==2.9.0",
    "cryptography==43.0.3",
    "boto3==1.35.50",
    "PyGithub==2.4.0",
    "structlog==24.4.0",
    "ulid-py==1.1.0",
    "python-multipart==0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
