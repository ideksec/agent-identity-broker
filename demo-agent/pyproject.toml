[project]
name = "demo-agent"
version = "0.1.0"
description = "Demo agent for the Identity Broker POC"
requires-python = ">=3.12"
dependencies = [
    "httpx==0.27.2",
    "structlog==24.4.0",
    "agent-sdk",
]

[tool.uv.sources]
agent-sdk = { path = "../sdk" }

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
