[project]
name = "agent-sdk"
version = "0.1.0"
description = "Agent SDK for the Identity Broker"
requires-python = ">=3.12"
dependencies = [
    "httpx==0.27.2",
    "pydantic==2.9.2",
    "PyJWT[crypto]==2.9.0",
    "spiffe==0.1.5",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
