[project]
name = "mock-idp"
version = "0.1.0"
description = "Mock IdP for OBO user JWTs"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.0",
    "PyJWT[crypto]==2.9.0",
    "cryptography==43.0.3",
    "PyYAML==6.0.2",
    "pydantic==2.9.2",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
