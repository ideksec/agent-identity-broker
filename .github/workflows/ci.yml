name: ci

# Lint and unit tests on every push and PR. Unit tests need no cluster;
# integration tests (kind + SPIRE) stay local-only for now.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  RUFF_VERSION: "0.9.4"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install "ruff==${RUFF_VERSION}"

      - name: Lint
        run: ruff check .

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            broker/pyproject.toml
            sdk/pyproject.toml

      - name: Install broker + sdk
        run: pip install -e './broker[dev]' -e ./sdk

      - name: Run unit tests
        run: python -m pytest tests/unit -v
