name: ci

# Lint and unit tests on every push and PR. Unit tests need no cluster;
# integration tests (kind + SPIRE) stay local-only for now.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  RUFF_VERSION: "0.9.4"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install "ruff==${RUFF_VERSION}"

      - name: Lint
        run: ruff check .

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.17"
          enable-cache: true

      # Install exactly what uv.lock records. --locked fails the job if the
      # lockfile is stale relative to any pyproject, so drift is caught here.
      - name: Install workspace from lockfile
        run: uv sync --locked --all-packages --all-extras

      - name: Run unit tests
        run: uv run --locked python -m pytest tests/unit -v
